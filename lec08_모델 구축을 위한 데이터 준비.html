<style>
/* Layout: one 16:9 motion stage rebuilt per scene (SVG + HTML layer) + controls + caption */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --ink:#0F2A35; --muted:#5A6F78; --line:#D2DEE2; --grid:rgba(0,88,124,.08);
  --s1:#00587C; --s2:#008EAA; --s3:#64CCC9;
  --pos:#D9822B; --neg:#008EAA; --err:#C8524A;
  --okbg:rgba(100,204,201,.22); --errbg:rgba(200,82,74,.13); --soft:#E3F4F8; --hot:rgba(224,149,42,.25);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A181E; --surface:#11252D; --ink:#E3EDF0; --muted:#8EA4AC; --line:#25424C; --grid:rgba(100,204,201,.07);
  --s1:#5DB3D4; --s2:#3DBBD3; --s3:#64CCC9; --pos:#F0A04B; --neg:#3DBBD3; --err:#E77A70;
  --okbg:rgba(100,204,201,.18); --errbg:rgba(231,122,112,.16); --soft:#0F3140; --hot:rgba(242,177,76,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A181E; --surface:#11252D; --ink:#E3EDF0; --muted:#8EA4AC; --line:#25424C; --grid:rgba(100,204,201,.07);
  --s1:#5DB3D4; --s2:#3DBBD3; --s3:#64CCC9; --pos:#F0A04B; --neg:#3DBBD3; --err:#E77A70;
  --okbg:rgba(100,204,201,.18); --errbg:rgba(231,122,112,.16); --soft:#0F3140; --hot:rgba(242,177,76,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
header.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);font-size:14px}

.stage-wrap{position:relative;width:100%;aspect-ratio:960/540;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:960px;height:540px;overflow:visible}
#hl{position:absolute;inset:0;pointer-events:none}
.no-anim,.no-anim *{transition:none!important;animation:none!important}

/* reveal system */
.rv{opacity:0;transition:opacity .55s,transform .65s cubic-bezier(.3,1.2,.5,1)}
.rv.on{opacity:1}
.rv.up{transform:translateY(12px)} .rv.up.on{transform:none}
.rv.pop{transform:scale(.4);transform-box:fill-box;transform-origin:center} .rv.pop.on{transform:none}
.rv.grow{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom} .rv.grow.on{transform:none}
.rv.growx{transform:scaleX(0);transform-box:fill-box;transform-origin:left} .rv.growx.on{transform:none}
.gone{opacity:0!important;pointer-events:none}
.draw{stroke-dasharray:1;stroke-dashoffset:1;opacity:1;transition:stroke-dashoffset 1.3s ease-in-out}
.draw.on{stroke-dashoffset:0}
[data-h]{transition:opacity .5s}

/* svg text */
.t{font:400 14px var(--f-ui);fill:var(--ink)}
.tl{font:500 13px var(--f-ui);fill:var(--muted)}
.tb{font:700 17px var(--f-ui);fill:var(--ink)}
.tn{font:600 14px var(--f-code);fill:var(--ink)}
.tbig{font:700 30px var(--f-code);fill:var(--ink)}
.mid{text-anchor:middle} .end{text-anchor:end}
.ax{stroke:var(--line);stroke-width:1.2;fill:none}
.gl{stroke:var(--grid);stroke-width:1}

/* html boxes */
.hb{position:absolute;font-size:14px;line-height:1.55;color:var(--ink)}
.fx{font:500 15px var(--f-code);background:var(--soft);border-radius:8px;padding:10px 14px}
.fx.sm{font-size:13.5px}
.fx b{color:var(--s1)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.big{font:700 32px var(--f-code);letter-spacing:-.01em}
.lab{font:600 12px var(--f-ui);color:var(--muted);letter-spacing:.04em}
.chip{display:inline-block;font:600 13px var(--f-code);padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--s1);margin:3px 4px 3px 0}
.box{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;text-align:center;font-weight:600}
.box.k1{border-color:var(--s1);color:var(--s1)} .box.k2{border-color:var(--s2);color:var(--s2)}
table.mt{border-collapse:collapse;font:400 13.5px var(--f-code);width:100%}
table.mt th,table.mt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
table.mt th{font:600 12px var(--f-ui);color:var(--muted)}
table.mt td:first-child,table.mt th:first-child{text-align:left}
table.mt .rv{transition:opacity .4s}
.okc{color:var(--s2);font-weight:700} .bad{color:var(--err);font-weight:700}
.note{font-size:13px;color:var(--muted)}

/* confusion matrix */
.cell{stroke:var(--line);stroke-width:1.5;transition:stroke .3s,stroke-width .3s,opacity .4s}
.cell.ok{fill:var(--okbg)} .cell.bad{fill:var(--errbg)}
.cell.hl{stroke:var(--ink);stroke-width:3.5}
.cell.dimc{opacity:.35}
.cname{font:700 15px var(--f-code);fill:var(--ink)}
.ccnt{font:700 26px var(--f-code);fill:var(--ink)}
.dot{transition:transform 1s cubic-bezier(.45,0,.25,1),fill .5s,opacity .4s}
.dot.pos{fill:var(--pos)} .dot.neg{fill:var(--neg)} .dot.grey{fill:var(--muted)}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);height:38px;min-width:38px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;font:500 14px var(--f-ui)}
.btn:hover{border-color:var(--s2)}
.btn:focus-visible,.chipb:focus-visible{outline:2px solid var(--s2);outline-offset:2px}
.btn.play{background:#00587C;color:#fff;border-color:#00587C;padding:0 14px}
.btn svg{width:16px;height:16px;fill:currentColor}
.chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.chipb{appearance:none;cursor:pointer;height:30px;min-width:30px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font:500 13px var(--f-ui);font-variant-numeric:tabular-nums}
.chipb.done{color:var(--s2)}
.chipb.cur{background:var(--s2);color:#fff;border-color:var(--s2)}
.bar2{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar2 i{display:block;height:100%;width:0;background:var(--s2);transition:width .4s}

.cap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px 18px}
.cap .eb{font:500 12px var(--f-ui);color:var(--s2);letter-spacing:.08em}
.cap h2{margin:2px 0 10px;font-size:20px;font-weight:700}
.cap ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px;max-width:80ch}
.cap li::marker{color:var(--s2)}
code{font-family:var(--f-code);font-size:.9em;background:var(--soft);color:var(--ink);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto}
table.sum{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.sum th,table.sum td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sum th{font-weight:600;color:var(--muted);font-size:12px}
table.sum td:first-child{font-weight:700}
@media (prefers-reduced-motion: reduce){.stage *{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>

  H('<div class="card"><div class="lab">Random split</div>train <span style="color:var(--s2)">●</span> · test <span style="color:var(--pos)">●</span> 무작위 배정</div>',520,40,400,{p:0});
  H(`<div class="card"><div class="lab">빨간 선 = test 분자와 가장 가까운 train 분자</div>대부분의 test 분자 바로 옆에 비슷한 train 분자가 있음</div>`,520,130,400,{p:1});
  // time split mini
  const tx0=540,tw=360,ty=330, XT=y=>tx0+(y-2015)/9*tw;
  const tg=G({p:2},SV); E('line',{x1:tx0,x2:tx0+tw,y1:ty+60,y2:ty+60,stroke:'var(--muted)','stroke-width':2},tg);
  [2015,2018,2021,2024].forEach(y=>T(tg,XT(y),ty+80,String(y),'tl mid'));
  T(tg,tx0,ty-10,'Time split: 과거(학습) → 미래(예측)','tb');
  const ry=rng(3); CHEM.forEach(p=>E('circle',{cx:XT(p.yr+ry()*.9),cy:ty+8+ry()*44,r:4,fill:p.yr>=2023?'var(--pos)':'var(--s2)'},tg));
  E('line',{x1:XT(2023),x2:XT(2023),y1:ty,y2:ty+66,stroke:'var(--ink)','stroke-width':2.5,'stroke-dasharray':'5 3'},tg);
  await c.ready(); await c.w(700);
  cp.color(i=>te.has(i)?TEC:TRC); c.ph(0); await c.w(1500);
  cp.lines(NN.random); c.ph(1); await c.w(2000); c.ph(2); await c.w(1500);
 }});

/* 19 */
S.push({t:'네 가지 화학 데이터 분할 전략',b:[
 'A. Random split: 분자를 무작위 배정 → 가장 쉬움, leakage 위험이 가장 높음',
 'B. Scaffold split: Bemis–Murcko scaffold(분자 골격)로 묶어 같은 scaffold는 train / test에 동시에 두지 않음',
 'C. Butina split: Morgan fingerprint 유사도로 Butina clustering → 유사 분자를 cluster 단위로 분리',
 'D. UMAP split: fingerprint → UMAP 2D 투영 → 큰 영역 단위 clustering → 가장 어려운 split, cluster 크기 불균형 문제 가능',
 '출처: Practical Cheminformatics (Walters, 2024)의 비교를 단순화한 모의 예시'],
 f:async c=>{
  const cp=chemPlot(SV,60,40,420,{shapes:true});

    scaffold:['B. Scaffold split','도형 모양 = 분자 골격(scaffold). 같은 scaffold 묶음은 통째로 train 또는 test','같은 scaffold가 양쪽에 나뉘지 않음'],
    butina:['C. Butina split','fingerprint 유사도로 가까운 분자끼리 cluster → cluster 단위로 test 배정','유사 분자를 cluster 단위로 분리'],
    umap:['D. UMAP split','UMAP 2D 투영 공간을 큰 영역으로 clustering → 영역 단위로 test 배정','가장 어려운 split · cluster 크기 불균형 가능']};
  const show=async(k,lab)=>{const [a,b,d]=info[k]; desc.innerHTML=`<div class="card"><div style="font-weight:700;font-size:17px">${a}</div><div style="margin-top:4px">${b}</div><div class="note" style="margin-top:6px">${d}</div></div>
     <div class="note" style="margin-top:10px">train <span style="color:var(--s2)">■</span> · test <span style="color:var(--pos)">■</span> · 점선 = 묶음(group)</div>`;
    cp.color(()=> 'var(--muted)'); if(lab) cp.hulls(lab); else cp.hg.innerHTML=''; await c.w(lab?1500:600);
    const te=SPLITS[k]; cp.color(i=>te.has(i)?TEC:TRC); await c.w(1900);};
  await c.ready(); await c.w(400);
  await show('random',null); await show('scaffold',CHEM.map(p=>p.sc)); await show('butina',BUT); await show('umap',REG);
 }});

/* 20 */
S.push({t:'Train–Test 유사성으로 본 split 난이도',b:[
 '각 test 분자에서 가장 가까운 train 분자까지의 거리 측정 (거리가 짧을수록 = 유사도가 높을수록 예측이 쉬움)',
 '모의 예시에서도 Random → Scaffold → Butina → UMAP 순으로 test가 train과 멀어짐',
 'Walters (2024): Tanimoto 유사도 Random > Scaffold > Butina > UMAP, ML 성능(R²)도 Random이 가장 높고 UMAP이 가장 낮음',
 'Split이 쉬우면 성능이 좋아 보임 → 그것이 곧 일반화 성능은 아님'],
 f:async c=>{
  const keys=[['random','Random'],['scaffold','Scaffold'],['butina','Butina'],['umap','UMAP']];
  const all=keys.flatMap(([k])=>NN[k].map(o=>o.d)); const dmax=Math.max(...all)*1.1;
  const x0=120,y0=60,h=360, Y=v=>y0+h-v/dmax*h;
  const tk=[0,.1,.2,.3,.4,.5].filter(v=>v<dmax);
  axes(SV,x0,y0,520,h,{yt:tk.map(v=>[v,v.toFixed(2)]),ym:Y,xt:keys.map((k,i)=>[i,k[1]]),xm:i=>x0+65+i*130,yl:'가장 가까운 train 분자까지 거리'});
  const r=rng(77);
  keys.forEach(([k],i)=>{const cx=x0+65+i*130; const g=G({p:i},SV);
    NN[k].forEach(o=>E('circle',{cx:cx+(r()-.5)*50,cy:Y(o.d),r:5,fill:'var(--pos)','fill-opacity':.75},g));
    const md=median(NN[k].map(o=>o.d)); E('line',{x1:cx-34,x2:cx+34,y1:Y(md),y2:Y(md),stroke:'var(--ink)','stroke-width':3},g); T(g,cx,Y(md)-10,'중앙값 '+md.toFixed(3),'tn mid');});
  H('<div class="card"><div class="lab">위로 갈수록</div>test 분자가 train과 덜 닮음<br>→ 예측이 어려움<br>→ 더 현실적인 평가</div>',680,60,250,{p:4});
  H('<div class="note">Walters (2024) 결과: test 분자의 평균 유사도 Random > Scaffold > Butina > UMAP<br>Morgan fingerprint + LightGBM의 R²도 같은 순서로 낮아짐</div>',680,240,250,{p:4});
  await c.ready(); for(let p=0;p<=4;p++){c.ph(p); await c.w(1200);}
 }});

/* 21 */
S.push({t:'Scaffold split의 한계와 split 선택',b:[
 '다른 scaffold ≠ 충분히 다른 화학 구조: 골격만 다르고 매우 비슷한 분자가 train / test에 나뉠 수 있음',
 '따라서 scaffold split도 성능을 과대평가할 수 있음 → train–test 최근접 이웃 유사도를 정량적으로 확인',
 '가능하면 Time split이 가장 현실적, timestamp가 없으면 Butina split이 균형 잡힌 선택 (Walters의 선호)',
 'GroupKFold / GroupKFoldShuffle로 cluster 단위 교차 검증 구현 가능'],
 f:async c=>{
  const cp=chemPlot(SV,60,40,420,{shapes:true});
  const te=SPLITS.scaffold; cp.color(i=>te.has(i)?TEC:TRC); cp.hulls(CHEM.map(p=>p.sc));
  const close=NN.scaffold.slice().sort((a,b)=>a.d-b.d).slice(0,3);
  const lg=G({p:1},SV); close.forEach(({i,j})=>{E('line',{x1:cp.X(CHEM[i].x),y1:cp.Y(CHEM[i].y),x2:cp.X(CHEM[j].x),y2:cp.Y(CHEM[j].y),stroke:'var(--err)','stroke-width':3},lg); E('circle',{cx:cp.X(CHEM[i].x),cy:cp.Y(CHEM[i].y),r:12,fill:'none',stroke:'var(--err)','stroke-width':2},lg);});
  H('<div class="card"><div class="lab">Scaffold split인데도</div>모양(scaffold)은 다르지만 바로 옆에 있는 train–test 쌍 존재 (빨간 선)</div>',520,40,410,{p:1});
  const flow=[['가능하면 <b>Time split</b><div class="note">과거로 학습 → 미래 분자 예측</div>',140],['Time 정보 없음 → 구조 기반 split',225],
    ['<b>Scaffold</b> 널리 쓰이나 낙관적 &nbsp;|&nbsp; <b>Butina</b> 유사도 직접 활용 &nbsp;|&nbsp; <b>UMAP</b> 가장 어려움, 크기 불균형',290]];
  flow.forEach(([h,y],i)=>H(`<div class="box" style="font-weight:500;text-align:left">${h}</div>`,520,y,410,{p:2+i}));
  H('<div class="fx sm">GroupKFold / GroupKFoldShuffle → cluster 단위 교차 검증</div>',520,400,410,{p:5});
  await c.ready(); c.ph(0); await c.w(1000); for(let p=1;p<=5;p++){c.ph(p); await c.w(1300);}
 }});

/* 22 */
S.push({t:'데이터 준비 정리',th:['주제','핵심 내용','사용 시점'],table:[
  ['Hold-out validation','training / validation / test를 6:2:2, 7:2:1 등으로 한 번 분할','데이터가 많을 때'],
  ['k-fold cross validation','k개 fold를 돌아가며 test로 사용, k개 결과 평균 (5-fold, 10-fold)','데이터가 적을 때'],
  ['Stratified k-fold','각 fold의 클래스 비율을 전체 비율과 비슷하게 유지','분류 · 클래스 불균형'],
  ['Undersampling / Oversampling','다수 클래스 축소 / 소수 클래스 복제, training set에만 적용','클래스 불균형'],
  ['SMOTE','소수 클래스 최근접 이웃 사이에 새 샘플 생성','클래스 불균형'],
  ['화학 데이터 split','Random < Scaffold < Butina < UMAP 순으로 어려움, 가능하면 Time split','분자 성질·활성 예측 모델 평가']],
 f:async c=>{
  const items=[['데이터 분할','Hold-out · k-fold · Stratified',1],['클래스 불균형','Under · Over · SMOTE',2],['화학 데이터 split','Random · Scaffold · Butina · UMAP · Time',3]];
  H('<div class="box" style="font-size:17px">모델 구축을 위한 데이터 준비</div>',330,40,300,{p:0});
  items.forEach(([a,b,p],i)=>{const x=40+i*305; const l=E('path',{d:`M480,88 C480,120 ${x+140},120 ${x+140},150`,fill:'none',stroke:'var(--muted)','stroke-width':1.6,pathLength:1,class:'draw'},SV); l.dataset.p=p;
    H(`<div class="box k1" style="font-size:16px">${a}<div style="font:600 13px var(--f-code);margin-top:6px;color:var(--s2)">${b}</div></div>`,x,152,280,{p});});
  H('<div class="card" style="text-align:center">핵심: test set은 마지막까지 보관 · 리샘플링은 training set에만 · split이 쉬우면 성능이 부풀려짐</div>',100,300,760,{p:4});
  await c.ready(); for(let p=0;p<=4;p++){c.ph(p); await c.w(1100);}
 }});

const N=S.length;

/* ---------- navigation ---------- */
let cur=-1, playing=false, holdTimer=0;
function caption(s){
  const sc=S[s];
  $('capN').textContent='장면 '+(s+1)+' / '+N; $('capT').textContent=sc.t;
  $('capB').innerHTML=sc.table
    ? '<div class="tbl"><table class="sum"><thead><tr>'+(sc.th||['평가 상황','주요 지표','함께 명시할 조건']).map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+sc.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</tbody></table></div>'
    : '<ul>'+sc.b.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  document.querySelectorAll('.chipb').forEach((c,i)=>{c.classList.toggle('cur',i===s); c.classList.toggle('done',i<s); c.setAttribute('aria-current',i===s?'step':'false');});
  $('prog').style.width=(s/(N-1)*100)+'%';
}
async function go(s){
  s=Math.max(0,Math.min(N-1,s));
  token.c=true; clearTimeout(holdTimer);
  const tk={c:false}; token=tk; cur=s;
  SV.innerHTML=''; HL.innerHTML=''; CV.style.display='none';
  stage.classList.add('no-anim');
  caption(s);
  const c=mkCtx(tk);
  c.ready=async()=>{reveal(-1); void stage.offsetWidth; await new Promise(r=>requestAnimationFrame(()=>r())); stage.classList.remove('no-anim'); chk(tk);};
  try{await S[s].f(c);}catch(e){ if(e!=='x') console.error(e); return;}
  if(playing&&!tk.c){
    if(s<N-1) holdTimer=setTimeout(()=>{if(playing&&token===tk) go(s+1);}, reduced?2500:4500);
    else setPlay(false);
  }
}
function setPlay(v){
  playing=v; $('lPlay').textContent=v?'일시정지':'재생';
  $('iPlay').innerHTML=v?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4.5v15l12-7.5z"/>';
  if(!v) clearTimeout(holdTimer);
}
S.forEach((sc,i)=>{const b=document.createElement('button'); b.className='chipb'; b.textContent=i+1; b.title=sc.t; b.setAttribute('aria-label','장면 '+(i+1)+': '+sc.t); b.onclick=()=>{setPlay(false); go(i);}; $('chips').appendChild(b);});
$('bPrev').onclick=()=>{setPlay(false); go(cur-1);};
$('bNext').onclick=()=>{setPlay(false); go(cur+1);};
$('bRe').onclick=()=>{go(cur);};
$('bPlay').onclick=()=>{ if(playing){setPlay(false);return;} setPlay(true); if(cur===N-1) go(0); else go(cur+1); };
document.addEventListener('keydown',e=>{
  if(e.key===' '&&e.target.closest&&e.target.closest('button')) return;
  if(e.key==='ArrowRight'){setPlay(false); go(cur+1);}
  else if(e.key==='ArrowLeft'){setPlay(false); go(cur-1);}
  else if(e.key===' '){e.preventDefault(); $('bPlay').click();}
});

setPlay(!reduced); go(0);
})();
</script>
